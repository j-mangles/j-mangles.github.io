/* v2 rotation, substitutions, lineup management */
.score-lineup-status{display:flex;flex-wrap:wrap;align-items:center;gap:7px}
.serve-pill{background:#223a4e;color:#c4f5e7;border-color:#3b6276}
.court-dot{color:var(--teal);font-size:.7rem;margin-left:4px;vertical-align:middle}
.lineup-layout{display:grid;grid-template-columns:minmax(0,1.13fr) minmax(320px,.87fr);gap:18px;align-items:start}
.lineup-court-panel{padding:22px}
.rotation-net{position:relative;text-align:center;background:repeating-linear-gradient(90deg,#bed1d6 0,#bed1d6 1px,transparent 1px,transparent 12px);height:20px;border-top:3px solid #e3f0f4;border-bottom:3px solid #d8e9ee;border-radius:3px;margin:6px 3px 0}
.rotation-net span{position:relative;top:-11px;display:inline-block;padding:4px 12px;background:#263d4a;border:1px solid #7d969e;border-radius:5px;font-size:.66rem;letter-spacing:.13em;font-weight:900}
.rotation-court{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(145px,1fr));gap:12px;padding:22px;background:linear-gradient(180deg,#205f63 0%,#176066 49%,#144e59 50%,#1b5c63 100%);border:4px solid #d2e8d6;border-top:0;border-radius:0 0 11px 11px;position:relative}
.rotation-court:before{content:'';position:absolute;top:50%;left:0;right:0;border-top:2px solid rgba(229,248,239,.35);pointer-events:none}
.rotation-player{color:var(--ink);border:2px solid rgba(145,207,194,.52);background:rgba(12,44,59,.77);border-radius:15px;min-width:0;min-height:138px;padding:14px 6px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px;position:relative}
.rotation-player:hover{background:#205c62}
.rotation-player.selected{border:3px solid #ffdc80;background:#244d56;box-shadow:0 0 0 3px rgba(255,220,128,.14)}
.rotation-player.server-position:after{content:'↗';color:var(--gold);position:absolute;right:10px;bottom:8px;font-size:1.45rem;font-weight:900}
.position-meta{font-size:.7rem;color:#b7dcdb;letter-spacing:.045em;font-weight:800}
.rotation-jersey{display:block;font-size:clamp(1.45rem,3vw,2.2rem);font-weight:900;line-height:1.1;color:#a8ffdd}
.rotation-name{font-size:.83rem;font-weight:750;text-align:center;overflow-wrap:anywhere;line-height:1.2}
.rotation-zone{font-size:.64rem;color:#98bfc0}
.court-bottom-label{text-align:center;font-size:.69rem;letter-spacing:.12em;color:var(--muted);font-weight:800;margin:11px 0 15px}
.lineup-controls{display:flex;flex-wrap:wrap;gap:9px}
.lineup-controls .btn{flex:1;min-height:51px;white-space:normal;text-align:center}
.candidate-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:365px;overflow:auto}
.candidate{color:var(--ink);display:flex;gap:9px;align-items:center;text-align:left;padding:10px 9px;border:1px solid #345168;background:#1b2e43;border-radius:12px;min-width:0;min-height:60px}
.candidate span:last-child{min-width:0}
.candidate strong{font-size:.79rem;display:block;line-height:1.25;overflow-wrap:anywhere}
.candidate small{font-size:.68rem;color:var(--muted);display:block;margin-top:4px}
.candidate.current{border:2px solid var(--gold);background:#4a463a}
.candidate.current .jersey{background:var(--gold);color:#322710}
.candidate:hover{background:#254457}
.candidate .jersey{width:38px;height:38px}
.server-toggle{display:flex;gap:9px;flex-wrap:wrap}
.server-toggle .btn{flex:1;min-width:110px}
.toggle-line{display:flex;flex-direction:row;align-items:center;gap:12px;margin-top:15px;cursor:pointer;color:var(--ink);font-weight:650;line-height:1.4}
.toggle-line input{width:22px;height:22px;min-height:0;accent-color:#47d9bb;flex-shrink:0;margin:0}
.lineup-log{max-height:230px;overflow-y:auto}
.lineup-log .event{align-items:start}
.lineup-log .event span:last-child{white-space:nowrap}
.default-lineup-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:12px}
.lineup-select-label{min-width:0}
.lineup-select-label span{font-size:.72rem}
@media(max-width:1100px){.lineup-layout{grid-template-columns:1fr}.rotation-court{grid-template-rows:repeat(2,minmax(125px,1fr))}}
@media(max-width:700px){.lineup-court-panel{padding:15px}.rotation-court{gap:7px;padding:11px;grid-template-rows:repeat(2,minmax(123px,1fr))}.rotation-player{min-height:123px;padding:7px 3px}.rotation-jersey{font-size:1.55rem}.rotation-name{font-size:.75rem}.position-meta{font-size:.61rem}.rotation-zone{font-size:.6rem}.candidate-grid{grid-template-columns:1fr 1fr}.default-lineup-grid{grid-template-columns:1fr}.score-lineup-status{width:100%}.server-toggle .btn{min-width:95px}.tabs .tab{padding-left:5px;padding-right:5px}}

/* V3: iPad-friendly libero and substitution controls */
.libero-controls{display:flex;flex-direction:column;gap:11px;padding-top:12px;margin-top:13px;border-top:1px solid var(--line)}
.libero-controls .btn{min-height:52px;white-space:normal;text-align:center}
.libero-controls .btn-row .btn{flex:1}
.rotation-player:has(.rotation-zone) {position:relative}

  school:{label:'Middle years / no libero · 12 unlimited',cap:12,limited:false,maxLiberos:0,description:'Suggested local-school option; confirm your tournament rules.'},

};
const profile=m=>PROFILES[m.rulesProfile]||PROFILES.practice;
const hasStarted=m=>m.events.some(e=>e.setIndex===m.sets.length-1);
function buildReg(m,previous=null){
 const slots=m.lineup.slots;
 const reg={setIndex:m.sets.length-1,slotKeys:[0,1,2,3,4,5],assigned:{},starters:{},subs:0,starterExits:{},starterReentries:{},entries:{},pairs:{},liberos:previous?.liberos?.slice(0,profile(m).maxLiberos)||[],liberoActive:null,replacedId:null,replacedKey:null,lastLiberoRally:-1,rally:0};
 for(let i=0;i<6;i++){if(slots[i]){reg.assigned[slots[i]]=i;reg.starters[i]=slots[i];}}
 reg.liberos=reg.liberos.filter(id=>m.roster.some(p=>p.id===id)&&!slots.includes(id));
 return reg;
}
function ensure(m){
 if(!PROFILES[m.rulesProfile])m.rulesProfile='practice'; // Historic v1/v2 matches remain flexible rather than retroactively restricted.
 if(!m.regulation||m.regulation.setIndex!==m.sets.length-1)m.regulation=buildReg(m,m.regulation);
 const r=m.regulation;
 if(!Array.isArray(r.slotKeys)||r.slotKeys.length!==6)r.slotKeys=[0,1,2,3,4,5];
 r.liberos=(r.liberos||[]).filter(id=>m.roster.some(p=>p.id===id)).slice(0,profile(m).maxLiberos);
 return r;
}
function rebaseBeforeSet(m){const r=ensure(m);if(hasStarted(m)||r.subs||r.liberoActive)return false;
 const keep=r.liberos.slice();m.regulation=buildReg(m,{liberos:keep});return true;}
function canSub(m,outId,inId){
 const r=ensure(m), cfg=profile(m), index=m.lineup.slots.indexOf(outId);
 if(index<0)return 'Choose a player currently on court.';
 if(!m.roster.some(p=>p.id===inId)||m.lineup.slots.includes(inId))return 'Choose an available bench player.';
 if(r.liberos.includes(inId)||r.liberos.includes(outId))return 'Use Libero replacement for designated liberos.';
 if(r.liberoActive&&inId===r.replacedId)return 'That player is currently being replaced by the libero; return the libero first.';
 const key=r.slotKeys[index];
 if(r.assigned[inId]!==undefined&&r.assigned[inId]!==key)return 'Illegal re-entry: this player is linked to another rotation slot this set.';
 if(cfg.cap!==null&&r.subs>=cfg.cap)return `Substitution limit reached (${cfg.cap} this set).`;
 if(cfg.limited){
   const starter=r.starters[key],isOutStarter=outId===starter;
   if(isOutStarter){
     if((r.starterExits[key]||0)>=1)return 'Limited rules: the starter has already left this set.';
     if(r.pairs[key]&&r.pairs[key]!==inId)return 'Limited rules: only the original paired substitute may enter.';
     if(r.entries[inId])return 'Limited rules: substitutes may enter only once per set.';
   }else{
     if(inId!==starter)return 'Limited rules: only the original starter may return for this substitute.';
     if((r.starterReentries[key]||0)>=1)return 'Limited rules: the starter has already re-entered once.';
   }
 }
 return null;
}
function doSub(m,outId,inId){const reason=canSub(m,outId,inId);if(reason)return {ok:false,reason};
 const r=ensure(m),i=m.lineup.slots.indexOf(outId),key=r.slotKeys[i],starter=r.starters[key];
 if(!Object.prototype.hasOwnProperty.call(r.assigned,inId))r.assigned[inId]=key;
 if(profile(m).limited){if(outId===starter){r.starterExits[key]=(r.starterExits[key]||0)+1;r.pairs[key]=inId;}else r.starterReentries[key]=(r.starterReentries[key]||0)+1;}
 r.entries[inId]=(r.entries[inId]||0)+1;
 r.subs++;m.lineup.slots[i]=inId;
 return {ok:true,position:i+1,slotKey:key};
}
function configureLiberos(m,ids){const r=ensure(m);if(hasStarted(m)||r.subs||r.liberoActive)return {ok:false,reason:'Set liberos before the first rally or substitution of this set.'};
 const selected=(ids||[]).filter(Boolean);
 if(new Set(selected).size!==selected.length)return {ok:false,reason:'Choose different players for each libero.'};
 if(selected.length>profile(m).maxLiberos)return {ok:false,reason:'Too many liberos for this rule profile.'};
 if(selected.some(id=>!m.roster.some(p=>p.id===id)||m.lineup.slots.includes(id)))return {ok:false,reason:'A designated libero must be an available bench player.'};
 r.liberos=selected;return {ok:true};}
function canLiberoIn(m,id,position){const r=ensure(m);if(!r.liberos.includes(id))return 'Designate this player as a libero before the set starts.';
 if(![1,5,6].includes(position))return 'Liberos may replace back-row players only (P1, P5 or P6).';
 if(m.lineup.serving==='home'&&position===1)return 'The libero cannot enter the serving position while we serve.';
 if(r.liberoActive)return 'Return or swap the current libero before a new replacement.';
 if(r.lastLiberoRally===r.rally)return 'Complete a rally between libero replacements.';
 const out=m.lineup.slots[position-1];if(!out)return 'No player occupies that position.';
 if(r.liberos.includes(out))return 'The libero is already on court.';
 return null;}
function liberoIn(m,id,position){const reason=canLiberoIn(m,id,position);if(reason)return {ok:false,reason};const r=ensure(m),i=position-1;
 r.replacedId=m.lineup.slots[i];r.replacedKey=r.slotKeys[i];r.liberoActive=id;r.lastLiberoRally=r.rally;m.lineup.slots[i]=id;return {ok:true,outId:r.replacedId,position};}
function liberoOut(m,automatic=false){const r=ensure(m);if(!r.liberoActive)return {ok:false,reason:'No libero on court.'};
 if(!automatic&&r.lastLiberoRally===r.rally)return {ok:false,reason:'Complete a rally between libero replacements.'};
 const i=m.lineup.slots.indexOf(r.liberoActive);
 if(i<0)return {ok:false,reason:'The libero is not in the rotation.'};
 const result={ok:true,outId:r.liberoActive,inId:r.replacedId,position:i+1,automatic};m.lineup.slots[i]=r.replacedId;
 r.liberoActive=null;r.replacedId=null;r.replacedKey=null;r.lastLiberoRally=r.rally;return result;
}
function liberoSwitch(m,id){const r=ensure(m);if(!r.liberoActive)return {ok:false,reason:'There is no acting libero to switch.'};
 if(!r.liberos.includes(id)||id===r.liberoActive)return {ok:false,reason:'Choose the other designated libero.'};
 if(r.lastLiberoRally===r.rally)return {ok:false,reason:'Complete a rally between libero replacements.'};
 const old=r.liberoActive,idx=m.lineup.slots.indexOf(old);if(idx<0)return {ok:false,reason:'Acting libero is not on court.'};
 m.lineup.slots[idx]=id;r.liberoActive=id;r.lastLiberoRally=r.rally;return {ok:true,outId:old,inId:id,position:idx+1};
}
function rotate(m,direction=1){const r=ensure(m);let autoOut=null;
 if(r.liberoActive){let idx=m.lineup.slots.indexOf(r.liberoActive),pos=idx+1;
  if((direction===1&&pos===5)||(direction===-1&&pos===4))autoOut=liberoOut(m,true);
 }
 const rotateOne=arr=>direction===1?[...arr.slice(1),arr[0]]:[arr[5],...arr.slice(0,5)];
 m.lineup.slots=rotateOne(m.lineup.slots);r.slotKeys=rotateOne(r.slotKeys);
 return autoOut;
}
function rally(m){ensure(m).rally++;}
function newSet(m){const r=ensure(m);m.regulation=buildReg(m,r);return m.regulation;}
return {PROFILES,profile,hasStarted,ensure,rebaseBeforeSet,canSub,doSub,configureLiberos,canLiberoIn,liberoIn,liberoOut,liberoSwitch,rotate,rally,newSet};
});

<script>
/* VolleyBoard v3 — rule-aware lineups and local-first iPad coaching. */
(() => {
'use strict';
const KEY = 'volleyboard_v1';
const Rules=globalThis.VBRules;
const ACTIONS = {
  kill:{label:'Kill',short:'K',detail:'+1 our point',stat:true},
  ace:{label:'Ace',short:'SA',detail:'+1 our point',stat:true},
  block:{label:'Stuff block',short:'B',detail:'+1 our point',stat:true},
  dig:{label:'Dig',short:'D',detail:'Stat only',stat:true},
  assist:{label:'Assist',short:'AST',detail:'Stat only',stat:true},
  serveError:{label:'Serve error',short:'SE',detail:'+1 opponent point',stat:true},
  attackError:{label:'Attack error',short:'AE',detail:'+1 opponent point',stat:true},
  oppError:{label:'Opponent error',short:'',detail:'+1 our point',stat:false},
  ourPoint:{label:'Our point',short:'',detail:'+1 our point',stat:false},
  theirPoint:{label:'Their point',short:'',detail:'+1 opponent point',stat:false},
  homeMinus:{label:'Our score correction',short:'',detail:'-1 our point',stat:false},
  awayMinus:{label:'Their score correction',short:'',detail:'-1 opponent point',stat:false},
};
const uid=()=>String(Date.now())+'_'+Math.random().toString(36).slice(2,9);
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateLocal=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const prettyDate=str=>{if(!str)return '';let d=new Date(str+'T12:00:00');return Number.isNaN(d.valueOf())?str:d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})};
function defaultMarkers(layout){
  const homeX=[755,755,500,245,245,500], homeY=layout==='half'?[492,179,179,179,492,492]:[511,369,369,369,511,511];
  const awayX=[245,245,500,755,755,500], awayY=[132,265,265,265,132,132];
  return [
    ...homeX.map((x,i)=>({id:'h'+(i+1),x,y:homeY[i],label:String(i+1),side:'home'})),
    ...awayX.map((x,i)=>({id:'a'+(i+1),x,y:awayY[i],label:String(i+1),side:'away'})),
    {id:'ball',x:500,y:555,label:'●',side:'ball'}
  ];
}
const blankBoard=(layout='full')=>({layout,markers:defaultMarkers(layout),strokes:[],name:''});
function freshState(){const players=Array.from({length:12},(_,i)=>({id:uid(),number:String(i+1),name:'Player '+(i+1)}));return {version:3,teamName:'My Team',players,defaultLineup:players.slice(0,6).map(p=>p.id),matches:[],currentMatchId:null,selectedPlayerId:null,selectedLineupSlot:1,board:blankBoard(),plays:[],tab:'match',historySelection:null,boardTool:'move',penColor:'#ffdf87',penWidth:5,selectedMarkerId:'h1',boardFocus:false,matchUndo:[],boardUndo:[]};}
let state;
try {const raw=localStorage.getItem(KEY); state=raw?Object.assign(freshState(),JSON.parse(raw)):freshState(); if(!Array.isArray(state.players)||!Array.isArray(state.matches)||!state.board)throw Error('Bad state');} catch(err){state=freshState();}
state.version=3;
if(!['match','lineup','board','history','team'].includes(state.tab))state.tab='match';
state.selectedLineupSlot=Number(state.selectedLineupSlot)||1;
// Upgrade v1 data in place without touching match results, events or saved plays.
function normalizeSlots(slots,roster){const ids=(roster||[]).map(p=>p.id),used=new Set();return Array.from({length:6},(_,i)=>{let id=Array.isArray(slots)?slots[i]:null;if(!ids.includes(id)||used.has(id))id=ids.find(x=>!used.has(x))||null;if(id)used.add(id);return id;});}
state.defaultLineup=normalizeSlots(state.defaultLineup,state.players);
function ensureLineup(m){if(!m.lineup){const slots=normalizeSlots(m.startingLineup,m.roster);m.startingLineup=slots.slice();m.lineup={slots:slots.slice(),serving:null,autoRotate:true,rotationCount:0};}else{m.lineup.slots=normalizeSlots(m.lineup.slots,m.roster);m.startingLineup=normalizeSlots(m.startingLineup||m.lineup.slots,m.roster);if(!['home','away'].includes(m.lineup.serving))m.lineup.serving=null;if(typeof m.lineup.autoRotate!=='boolean')m.lineup.autoRotate=true;if(!Number.isFinite(m.lineup.rotationCount))m.lineup.rotationCount=0;}if(!Array.isArray(m.lineupEvents))m.lineupEvents=[];for(const set of m.sets||[]){if(!Array.isArray(set.startingLineup))set.startingLineup=m.startingLineup.slice();}}
state.matches.forEach(m=>{ensureLineup(m);Rules.ensure(m)});
const $=sel=>document.querySelector(sel);
const main=$('#main');
let toastTimeout;
function toast(message){const el=$('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>el.classList.remove('show'),2800)}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));const label=$('#saveStatus');if(label)label.textContent='● Saved on device';}catch(e){toast('Device storage is full or unavailable. Please export a backup.');}}
function match(){return state.matches.find(m=>m.id===state.currentMatchId)||null}
function selectedPlayer(m=match()){return m?.roster.find(p=>p.id===state.selectedPlayerId)||m?.roster[0]||null}
function matchWins(m){return m.sets.reduce((r,s)=>{if(s.winner==='home')r.home++;if(s.winner==='away')r.away++;return r},{home:0,away:0})}
function countStats(m,playerId,setIndex=null){const res={kill:0,ace:0,block:0,dig:0,assist:0,serveError:0,attackError:0};for(const ev of m.events){if(ev.playerId===playerId&&(setIndex===null||setIndex===ev.setIndex)&&res[ev.action]!==undefined)res[ev.action]++}return res}
function totals(m){const t={kill:0,ace:0,block:0,dig:0,assist:0,serveError:0,attackError:0};m.events.forEach(ev=>{if(t[ev.action]!==undefined)t[ev.action]++});return t}
function summaryTable(m){if(!m.roster.length)return '<p class="no-data">No players on this match roster.</p>';return `<div class="table-wrap"><table class="stats-table"><thead><tr><th>Player</th><th>K</th><th>Aces</th><th>Blk</th><th>Digs</th><th>Ast</th><th>AE</th><th>SE</th></tr></thead><tbody>${m.roster.map(p=>{let s=countStats(m,p.id);return `<tr><td><strong>#${esc(p.number)}</strong> ${esc(p.name)}</td><td>${s.kill}</td><td>${s.ace}</td><td>${s.block}</td><td>${s.dig}</td><td>${s.assist}</td><td>${s.attackError}</td><td>${s.serveError}</td></tr>`}).join('')}</tbody></table></div><p class="download-note">K = kills · Blk = stuff blocks · Ast = assists · AE = attack errors · SE = serve errors. Stats count taps; this first version does not calculate hitting percentage.</p>`}
function actionText(ev,m){const p=ev.playerId?m.roster.find(x=>x.id===ev.playerId):null;return (p?'#'+p.number+' '+p.name+' · ':'')+(ACTIONS[ev.action]?.label||ev.action)}
function render(){
  document.body.classList.toggle('board-focus',!!(state.boardFocus&&state.tab==='board'));
  document.querySelectorAll('.tab').forEach(el=>{let active=el.dataset.tab===state.tab;el.classList.toggle('active',active);el.setAttribute('aria-current',active?'page':'false')});
  if(state.tab==='match')renderMatch();
  if(state.tab==='lineup')renderLineup();
  if(state.tab==='board')renderBoard();
  if(state.tab==='history')renderHistory();
  if(state.tab==='team')renderTeam();
}
function matchForm(){return `<div class="empty-state"><span class="empty-icon">🏐</span><h2>Ready for the next match?</h2><p class="muted">Start a match to track points and player stats as you coach. Everything saves on this iPad.</p><div class="panel"><form id="newMatchForm" class="form-stack"><label>Opponent<input name="opponent" placeholder="e.g. Springfield" maxlength="70" required autofocus></label><div class="two-inputs"><label>Match date<input name="date" type="date" value="${dateLocal()}" required></label><label>Match format<select name="bestOf"><option value="3">Best of 3 (25 / 25 / 15)</option><option value="5">Best of 5 (25 / 25 / 25 / 25 / 15)</option></select></label></div><label>Rules for this match<select name="rulesProfile">${Object.entries(Rules.PROFILES).map(([key,cfg])=>`<option value="${key}" ${key==='mhsaa'?'selected':''}>${esc(cfg.label)}</option>`).join('')}</select></label><button class="btn primary wide" type="submit">Start match →</button></form><p class="download-note">Standard rally scoring: sets to 25, deciding set to 15, win by 2. Use Team to edit your roster before starting if needed.</p></div></div>`}
function renderMatch(){const m=match();if(!m){main.innerHTML=matchForm();return;}const isLive=m.status==='live';const win=matchWins(m);const set=m.sets.at(-1),setNo=m.sets.length;
let scoreCard=`<section class="panel scoreboard"><div class="score-top"><div class="btn-row"><span class="pill ${isLive?'live':'complete'}">${isLive?'● LIVE MATCH':'✓ MATCH FINISHED'}</span><span class="small muted">${esc(prettyDate(m.date))} · Best of ${m.bestOf}</span></div><button class="btn sm ghost" data-action="undo-match" ${!state.matchUndo?.length?'disabled':''}>↶ Undo</button></div><div class="score-sides"><div class="score-side"><div class="side-label home">${esc(m.teamName)}</div><div class="score-num">${set.home}</div><div class="score-adjust"><button class="btn sm btn-icon" data-action="score" data-type="homeMinus" ${!isLive||set.home===0?'disabled':''} aria-label="Subtract one point from our team">−</button><button class="btn sm btn-icon" data-action="score" data-type="ourPoint" ${!isLive?'disabled':''} aria-label="Add one point to our team">+</button></div></div><div class="score-dash">–</div><div class="score-side"><div class="side-label away">${esc(m.opponent)}</div><div class="score-num">${set.away}</div><div class="score-adjust"><button class="btn sm btn-icon" data-action="score" data-type="awayMinus" ${!isLive||set.away===0?'disabled':''} aria-label="Subtract one point from opponent">−</button><button class="btn sm btn-icon" data-action="score" data-type="theirPoint" ${!isLive?'disabled':''} aria-label="Add one point to opponent">+</button></div></div></div><div class="score-footer"><div><div class="tiny muted" style="margin-bottom:7px">SET SCORE <strong style="color:var(--ink);margin-left:6px">${win.home} — ${win.away}</strong></div><div class="set-pills">${m.sets.map((s,i)=>`<span class="set-pill ${i===setNo-1&&isLive?'active':''}">S${i+1} ${s.home}–${s.away}</span>`).join('')}</div></div><div class="score-lineup-status"><span class="pill">${isLive?'Set '+setNo+' · First to '+(setNo===m.bestOf?15:25):'Final · '+(win.home>win.away?'Win':win.away>win.home?'Loss':'Ended')}</span><span class="pill serve-pill">${m.lineup.serving==='home'?'● We serve':m.lineup.serving==='away'?'● They serve':'○ Server not set'}</span></div></div></section>`;
let playerOptions=[...m.roster].sort((a,b)=>{const ai=m.lineup.slots.indexOf(a.id),bi=m.lineup.slots.indexOf(b.id);return (ai===-1?100:ai)-(bi===-1?100:bi)}).map(p=>{let s=countStats(m,p.id);return `<button class="player ${selectedPlayer(m)?.id===p.id?'selected':''}" data-action="select-player" data-id="${esc(p.id)}"><span class="jersey">${esc(p.number)}</span><span class="player-info"><span class="player-name">${esc(p.name)}${m.lineup.slots.includes(p.id)?' <span class="court-dot" title="On court">●</span>':''}</span><span class="player-summary">${m.lineup.slots.includes(p.id)?'ON COURT':'BENCH'} · ${s.kill} K · ${s.ace} A · ${s.serveError} SE</span></span></button>`}).join('');
let selected=selectedPlayer(m);
let buttons=[['kill','good'],['ace','good'],['block','good'],['dig','neutral'],['assist','neutral'],['serveError','bad'],['attackError','bad']].map(([key,kind])=>`<button class="stat-btn ${kind}" data-action="stat" data-type="${key}" ${!isLive||!selected?'disabled':''}><strong>${esc(ACTIONS[key].label)}</strong><small>${esc(ACTIONS[key].detail)}</small></button>`).join('');
let t=totals(m);
main.innerHTML=`<div class="page-heading"><div><h1 class="page-title">${esc(m.teamName)} vs. ${esc(m.opponent)}</h1><p class="subheading">Tap a player, then record the rally. Use the whiteboard tab anytime.</p></div><div class="btn-row"><button class="btn ghost sm" data-tab-go="lineup">⟳ Lineup</button><button class="btn ghost sm" data-tab-go="board">✎ Whiteboard</button>${isLive?`<button class="btn sm ghost" data-action="finish-match">End match</button>`:`<button class="btn sm primary" data-action="new-match">+ New match</button>`}</div></div><div class="match-grid"><div class="left-stack">${scoreCard}<section class="panel"><h2>Quick score</h2><div class="mini-actions"><button class="btn" data-action="score" data-type="oppError" ${!isLive?'disabled':''}><strong>+ Our point</strong><small>Opponent mistake / other</small></button><button class="btn" data-action="score" data-type="theirPoint" ${!isLive?'disabled':''}><strong>+ Their point</strong><small>Opponent earned it</small></button></div><div class="hint" style="margin-top:12px">Kills, aces and stuff blocks automatically give your team 1 point. Serve and attack errors give the opponent 1 point. Digs and assists record only a stat.</div></section><section class="panel"><div class="button-spread"><h2>Recent actions</h2><button class="btn sm ghost" data-action="undo-match" ${!state.matchUndo?.length?'disabled':''}>↶ Undo last</button></div><div class="events">${m.events.length?m.events.slice(-7).reverse().map(ev=>`<div class="event"><span>${esc(actionText(ev,m))}</span><span class="muted">S${ev.setIndex+1}${ev.dh>0?' · +1 us':ev.da>0?' · +1 them':ev.dh<0?' · −1 us':ev.da<0?' · −1 them':''}</span></div>`).join(''):'<div class="no-data">Your first rally will appear here.</div>'}</div></section></div><div class="right-stack"><section class="panel"><div class="button-spread"><h2>Roster <span class="muted">(${m.roster.length})</span></h2><span class="tiny muted">Select a player</span></div><div class="roster-list">${pla }
function renderBoard(){const b=state.board;main.innerHTML=`<div class="page-heading"><div><h1 class="page-title">Tactics whiteboard</h1><p class="subheading">Move players, draw routes, and save plays. Works with Apple Pencil or touch.</p></div><button class="btn ${state.boardFocus?'primary':'ghost'}" data-action="focus-board">${state.boardFocus?'↙ Exit focus mode':'⛶ Focus mode'}</button></div><div class="board-layout"><div class="board-main"><div class="board-toolbar"><button class="btn tool ${state.boardTool==='move'?'active':''}" data-action="board-tool" data-value="move">✥ Move</button><button class="btn tool ${state.boardTool==='pen'?'active':''}" data-action="board-tool" data-value="pen">✎ Draw</button><button class="btn tool ${state.boardTool==='arrow'?'active':''}" data-action="board-tool" data-value="arrow">↗ Arrow</button><button class="btn tool ${state.boardTool==='erase'?'active':''}" data-action="board-tool" data-value="erase">⌫ Erase</button>${['#ffdf87','#ffffff','#73dff5','#ff858d'].map(c=>`<button class="color-btn ${state.penColor===c?'active':''}" style="background:${c}" data-action="pen-color" data-value="${c}" aria-label="Use ${c} ink"></button>`).join('')}<div class="board-mode"><button class="btn sm ${b.layout==='full'?'blue':'ghost'}" data-action="court-mode" data-value="full">Full</button><button class="btn sm ${b.layout==='half'?'blue':'ghost'}" data-action="court-mode" data-value="half">Half</button></div></div><div class="board-shell"><canvas id="court" class="board-canvas" width="2000" height="1280" aria-label="Volleyball tactics court with movable player markers and drawing tools"></canvas></div><div class="button-spread" style="margin-top:12px"><div class="btn-row"><button class="btn sm" data-action="board-undo" ${!state.boardUndo.length?'disabled':''}>↶ Undo</button><button class="btn sm" data-action="clear-ink" ${b.strokes.length===0?'disabled':''}>Clear ink</button><button class="btn sm ghost" data-action="reset-markers">Reset positions</button></div><button class="btn sm blue" data-action="export-png">↓ Save image</button></div><p class="download-note">Tip: Use <strong>Move</strong> to drag markers. Use <strong>Draw</strong> for freehand routes or <strong>Arrow</strong> for a straight tactical arrow; <strong>Erase</strong> removes a drawn stroke. Whiteboard changes auto-save.</p></div><aside class="board-sidebar"><section class="panel"><h2>Saved plays</h2><label>Play name<input id="playName" value="${esc(b.name)}" placeholder="e.g. Serve receive 1" maxlength="70"></label><div class="btn-row" style="margin-top:11px"><button class="btn primary wide" data-action="save-play">Save as new play</button></div>${state.plays.length?[...state.plays].reverse().map(p=>`<div class="saved-play"><strong>${esc(p.name)}</strong><small>${p.layout==='half'?'Half court':'Full court'} · ${esc(prettyDate(p.savedAt?.slice(0,10)))}</small><div class="btn-row"><button class="btn sm" data-action="load-play" data-id="${esc(p.id)}">Load</button><button class="btn sm red" data-action="delete-play" data-id="${esc(p.id)}">Delete</button></div></div>`).join(''):'<p class="no-data">No plays saved yet.</p>'}</section><section class="panel"><h2>Marker labels</h2>${match()?'<button class="btn sm blue wide" data-action="board-use-lineup" style="margin-bottom:12px">↳ Use live lineup jersey numbers</button>':''}<p class="section-intro">Tap a player marker using <strong>Move</strong>, then change its label to a jersey number or position.</p><label>Selected marker<input id="markerLabel" maxlength="5" placeholder="Select a marker"></label><button class="btn sm ghost" data-action="new-board" style="margin-top:11px;width:100%">+ Fresh whiteboard</button><p class="board-help" style="margin-top:12px">Teal markers = your team. Blue markers = opponents (full court). The yellow marker = ball. Positions are draggable anywhere on the court.</p></section></aside></div>`;
initCanvas();syncMarkerInput();}
function newMatch(data){const slots=normalizeSlots(state.defaultLineup,state.players);const m={id:uid(),teamName:state.teamName||'My Team',opponent:data.opponent.trim(),date:data.date,bestOf:Number(data.bestOf),roster:clone(state.players),sets:[{home:0,away:0,winner:null,startingLineup:slots.slice()}],events:[],status:'live',startingLineup:slots.slice(),lineup:{slots:slots.slice(),serving:null,autoRotate:true,rotationCount:0},lineupEvents:[],rulesProfile:Rules.PROFILES[data.rulesProfile]?data.rulesProfile:'mhsaa'};Rules.ensure(m);state.matches.push(m);state.currentMatchId=m.id;state.selectedPlayerId=m.lineup.slots.find(Boolean)||m.roster[0]?.id||null;state.matchUndo=[];persist();render();toast('Match started — choose the first server on Lineup!')}
function record(action,playerId=null){const m=match();if(!m||m.status!=='live')return;const s=m.sets.at(-1);if(m.regulation?.liberos?.includes(playerId)&&['ace','block'].includes(action)){toast('A designated libero cannot serve or block.');return;}let dh=0,da=0;if(['kill','ace','block','ourPoint','oppError'].includes(action))dh=1;if(['serveError','attackError','theirPoint'].includes(action))da=1;if(action==='homeMinus'&&s.home>0)dh=-1;if(action==='awayMinus'&&s.away>0)da=-1;if(['homeMinus','awayMinus'].includes(action)&&dh===0&&da===0)return;
snapshotMatch(m);
m.events.push({id:uid(),time:new Date().toISOString(),setIndex:m.sets.length-1,playerId,action,dh,da});s.home+=dh;s.away+=da;if(dh>0||da>0)Rules.rally(m);
// Rotation only occurs when our team wins the rally while receiving.
if(dh>0&&m.lineup.serving==='away'){if(m.lineup.autoRotate)rotateLineup(m,1,'auto');m.lineup.serving='home';}else if(da>0&&m.lineup.serving==='home'){m.lineup.serving='away';}
const to=m.sets.length===m.bestOf?15:25;let winner=null;if(s.home>=to&&s.home-s.away>=2)winner='home';if(s.away>=to&&s.away-s.home>=2)winner='away';let message='Recorded: '+ACTIONS[action].label;
if(winner){s.winner=winner;const won=matchWins(m);if(Math.max(won.home,won.away)>=Math.ceil(m.bestOf/2)){m.status='finished';message=(winner==='home'?'Match won! 🏆':'Match complete')+' Final: '+won.home+'–'+won.away;}else{const newSlots=normalizeSlots(m.startingLineup,m.roster);m.lineup.slots=newSlots.slice();m.lineup.serving=null;m.lineup.rotationCount=0;m.sets.push({home:0,away:0,winner:null,startingLineup:newSlots.slice()});Rules.newSet(m);message='Set '+(m.sets.length-1)+' '+(winner==='home'?'won!':'lost.')+' Next set ready.';}}
persist();render();toast(message);}
function undoMatch(){const m=match();if(!m||!state.matchUndo.length)return;let last=state.matchUndo.pop();if(last.id!==m.id){state.matchUndo=[];toast('Undo history belongs to another match.');return}let idx=state.matches.findIndex(x=>x.id===m.id);state.matches[idx]=last.snapshot;persist();render();toast('Last action undone')}
function finishMatch(){const m=match();if(!m)return;if(!confirm('End this match now? The match will remain in History.'))return;m.status='finished';state.matchUndo=[];persist();render();toast('Match saved to History');}
function download(content,filename,mime){const blob=new Blob([content],{type:mime});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=filename;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function exportCsv(m){if(!m)return;const rows=[['Match','Date','Team','Opponent','Jersey','Player','Kills','Aces','Blocks','Digs','Assists','Attack errors','Serve errors']];m.roster.forEach(p=>{let s=countStats(m,p.id);rows.push([m.id,m.date,m.teamName,m.opponent,p.number,p.name,s.kill,s.ace,s.block,s.dig,s.assist,s.attackError,s.serveError])});const csv=rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download('\ufeff'+csv,`volleyboard-${(m.opponent||'match').replace(/[^a-z0-9-]/ig,'-')}-${m.date}.csv`,'text/csv;charset=utf-8');toast('CSV exported')}
// ---- Whiteboard drawing / touch interactions ----
let canvas=null,ctx=null,pointerState=null;
function boardSnapshot(){state.boardUndo.push(clone(state.board));if(state.boardUndo.length>40)state.boardUndo.shift()}
function boardSave(){persist()}
function courtDraw(){if(!ctx)return;const b=state.board;ctx.setTransform(2,0,0,2,0,0);ctx.clearRect(0,0,1000,640);
const half=b.layout==='half';const top=half?80:49,bottom=half?580:591,left=87,right=913,net=half?80:320;
ctx.fillStyle='#0a3543';ctx.fillRect(0,0,1000,640);ctx.fillStyle='#175c62';ctx.fillRect(left,top,right-left,bottom-top);
ctx.strokeStyle='rgba(234,255,244,.17)';ctx.lineWidth=2;for(let k=0;k<14;k++){let x=left+(right-left)*k/13;ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,bottom);ctx.stroke()}
ctx.fillStyle='rgba(0,0,0,.12)';if(!half)ctx.fillRect(left,top,right-left,net-top);
ctx.strokeStyle='#dcf6e7';ctx.lineWidth=5;ctx.strokeRect(left,top,right-left,bottom-top);
ctx.strokeStyle='#d1f7ea';ctx.lineWidth=3;function line(y){ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(right,y);ctx.stroke()}if(half){line(240)}else{line(231);line(409)}
ctx.strokeStyle='#fff5cb';ctx.lineWidth=half?7:8;line(net);
ctx.strokeStyle='rgba(255,255,255,.68)';ctx.lineWidth=2;for(let x=left;x<right;x+=19){ctx.beginPath();ctx.moveTo(x,net-7);ctx.lineTo(x,net+7);ctx.stroke()}
ctx.fillStyle='#e1f6ed';ctx.font='700 18px system-ui';ctx.textAlign='center';ctx.fillText(half?'YOUR COURT · NET':'OPPONENTS',500,half?45:30);if(!half)ctx.fillText('YOUR TEAM',500,625);ctx.font='600 15px system-ui';ctx.fillStyle='#b3d8d3';ctx.fillText(half?'BASELINE':'',500,614);
for(const stroke of b.strokes){if(!stroke.points.length)continue;ctx.strokeStyle=stroke.color;ctx.lineWidth=stroke.width||5;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();stroke.points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));if(stroke.points.length===1){ctx.lineTo(stroke.points[0].x+.1,stroke.points[0].y+.1)}ctx.stroke();if(stroke.arrow&&stroke.points.length>1){const a=stroke.points[0],z=stroke.points.at(-1),angle=Math.atan2(z.y-a.y,z.x-a.x),len=18;ctx.beginPath();ctx.moveTo(z.x,z.y);ctx.lineTo(z.x-len*Math.cos(angle-.48),z.y-len*Math.sin(angle-.48));ctx.moveTo(z.x,z.y);ctx.lineTo(z.x-len*Math.cos(angle+.48),z.y-len*Math.sin(angle+.48));ctx.stroke();}}
for(const marker of b.markers){if(half&&marker.side==='away')continue;const isHome=marker.side==='home',isBall=marker.side==='ball';ctx.save();ctx.shadowColor='#0009';ctx.shadowBlur=12;ctx.shadowOffsetY=3;ctx.beginPath();ctx.arc(marker.x,marker.y,isBall?21:25,0,2*Math.PI);ctx.fillStyle=isBall?'#f5ca67':isHome?'#47d9bb':'#80bbff';ctx.fill();ctx.restore();if(marker.id===state.selectedMarkerId&&state.boardTool==='move'){ctx.strokeStyle='#ffffff';ctx.lineWidth=4;ctx.beginPath();ctx.arc(marker.x,marker.y,isBall?26:31,0,2*Math.PI);ctx.stroke()}
ctx.font=(isBall?'bold 19px':'bold 20px')+' system-ui';ctx.fillStyle='#052a32';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(marker.label,marker.x,marker.y+1);}}
function coords(e){const box=canvas.getBoundingClientRect();return {x:Math.max(0,Math.min(1000,(e.clientX-box.left)/box.width*1000)),y:Math.max(0,Math.min(640,(e.clientY-box.top)/box.height*640))}}
function nearMarker(p){const arr=[...state.board.markers].reverse();return arr.find(m=>(state.board.layout==='full'||m.side!=='away')&&Math.hypot(m.x-p.x,m.y-p.y)<36)}
function eraseAt(p){let strokes=state.board.strokes;let before=strokes.length;state.board.strokes=strokes.filter(st=>!st.points.some(q=>Math.hypot(q.x-p.x,q.y-p.y)<(st.width+15)));return before!==state.board.strokes.length}
function syncMarkerInput(){const el=$('#markerLabel');if(!el)return;const marker=state.board.markers.find(m=>m.id===state.selectedMarkerId);el.value=marker?.label||'';el.disabled=!marker;}
function initCanvas(){canvas=$('#court');if(!canvas)return;ctx=canvas.getContext('2d');courtDraw();canvas.style.cursor=state.boardTool==='move'?'grab':state.boardTool==='erase'?'cell':'crosshair';
canvas.onpointerdown=e=>{if(e.button!==0&&e.pointerType==='mouse')return;e.preventDefault();const p=coords(e),tool=state.boardTool;pointerState={id:e.pointerId,tool,moved:false,originalBoard:clone(state.board),erased:false};try{canvas.setPointerCapture(e.pointerId)}catch(_e){}
if(tool==='move'){let m=nearMarker(p);if(m){pointerState.markerId=m.id;state.selectedMarkerId=m.id;syncMarkerInput();}}else if(tool==='pen'||tool==='arrow'){const stroke={color:state.penColor,width:state.penWidth,arrow:tool==='arrow',points:[p]};state.board.strokes.push(stroke);pointerState.stroke=stroke;}else if(tool==='erase'){pointerState.erased=eraseAt(p)}courtDraw()};
canvas.onpointermove=e=>{if(!pointerState||pointerState.id!==e.pointerId)return;e.preventDefault();const p=coords(e);if(pointerState.tool==='move'&&pointerState.markerId){const m=state.board.markers.find(m=>m.id===pointerState.markerId);if(m){m.x=Math.max(35,Math.min(965,p.x));m.y=Math.max(32,Math.min(608,p.y));pointerState.moved=true;}}else if(pointerState.tool==='pen'||pointerState.tool==='arrow'){if(pointerState.tool==='arrow')pointerState.stroke.points=[pointerState.stroke.points[0],p];else pointerState.stroke.points.push(p);pointerState.moved=true;}else if(pointerState.tool==='erase'){pointerState.erased=eraseAt(p)||pointerState.erased;}courtDraw()};
const stop=e=>{if(!pointerState||pointerState.id!==e.pointerId)return;const changed=pointerState.tool==='pen'||pointerState.tool==='arrow'||pointerState.moved||pointerState.erased;if(changed){state.boardUndo.push(pointerState.originalBoard);if(state.boardUndo.length>40)state.boardUndo.shift();boardSave()}pointerState=null;courtDraw();};canvas.onpointerup=stop;canvas.onpointercancel=stop;}
function exportImage(){const c=$('#court');if(!c)return;try{c.toBlob(blob=>{if(!blob){toast('Could not create image');return}const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='volleyboard-'+(state.board.name||'play').replace(/[^a-z0-9-]/ig,'-')+'.png';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)},'image/png');toast('Court image exported')}catch(e){toast('Image export not supported here')}}
// ---- Event wiring ----
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;state.tab=b.dataset.tab;state.boardFocus=false;persist();render()});
main.addEventListener('submit',e=>{e.preventDefault();const id=e.target.id;const f=new FormData(e.target);if(id==='substitutionForm'){substitute(String(f.get('out')||''),String(f.get('in')||''));}if(id==='newMatchForm'){const opponent=String(f.get('opponent')||'').trim();if(!opponent)return;newMatch({opponent,date:String(f.get('date')),bestOf:f.get('bestOf'),rulesProfile:String(f.get('rulesProfile')||'mhsaa')});}if(id==='teamNameForm'){const name=String(f.get('teamName')||'').trim();if(!name)return;state.teamName=name;persist();render();toast('Team name saved');}if(id==='addPlayerForm'){const number=String(f.get('number')||'').trim(),name=String(f.get('name')||'').trim();if(!number||!name)return;state.players.push({id:uid(),number,name});state.defaultLineup=normalizeSlots(state.defaultLineup,state.players);persist();render();toast(name+' added');}});
main.addEventListener('change',async e=>{const target=e.target;if(target.matches('[data-default-slot]')){const pos=Number(target.dataset.defaultSlot)-1,id=target.value,other=state.defaultLineup.indexOf(id),old=state.defaultLineup[pos];if(pos>=0&&pos<6){state.defaultLineup[pos]=id||null;if(other!==-1&&other!==pos)state.defaultLineup[other]=old;state.defaultLineup=normalizeSlots(state.defaultLineup,state.players);persist();render();toast('Starting six saved');}return;}if(target.matches('[data-libero-select]')){const m=match();if(!m)return;const selects=[...main.querySelectorAll('[data-libero-select]')].map(el=>el.value);configureMatchLiberos(selects);return;}if(target.id==='autoRotateToggle'){const m=match();if(m&&m.status==='live'){snapshotMatch(m);m.lineup.autoRotate=target.checked;persist();render();toast(target.checked?'Automatic rotation on':'Manual rotation only');}return;}if(target.matches('[data-player-field]')){const player=state.players.find(p=>p.id===target.dataset.id);if(!player)return;let value=target.value.trim();if(!value){target.value=player[target.dataset.playerField];return}player[target.dataset.playerField]=value;persist();toast('Roster updated');}if(target.id==='markerLabel'){const m=state.board.markers.find(x=>x.id===state.selectedMarkerId);if(m){boardSnapshot();m.label=target.value.trim().slice(0,5)||m.label;boardSave();courtDraw();}}if(target.id==='importFile'&&target.files?.[0]){let f=target.files[0];try{const data=JSON.parse(await f.text());if(!Array.isArray(data.players)||!Array.isArray(data.matches)||!data.board||!Array.isArray(data.plays))throw Error('Not a VolleyBoard backup');if(!confirm('Restore backup? This REPLACES all current matches, plays and team data on this device.')){target.value='';return}state=Object.assign(freshState(),data,{version:3,tab:'team',boardFocus:false,matchUndo:[],boardUndo:[]});state.defaultLineup=normalizeSlots(state.defaultLineup,state.players);state.matches.forEach(m=>{ensureLineup(m);Rules.ensure(m)});persist();render();toast('Backup restored successfully')}catch(err){toast('Could not import: '+err.message)}}});
main.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.tabGo){state.tab=b.dataset.tabGo;persist();render();return}
const action=b.dataset.action;const id=b.dataset.id;
if(action==='lineup-position'){state.selectedLineupSlot=Number(b.dataset.pos);persist();render();return;}
if(action==='lineup-assign'){assignLineup(Number(state.selectedLineupSlot),id);return;}
if(action==='lineup-rotate'){const m=match();if(!m||m.status!=='live')return;snapshotMatch(m);rotateLineup(m,Number(b.dataset.direction));persist();render();toast('Rotation updated');return;}
if(action==='lineup-serving'){setServing(b.dataset.side);return;}
if(action==='libero-in'){liberoOperation('in',$('#liberoInId')?.value,Number($('#liberoPosition')?.value));return;}
if(action==='libero-out'){liberoOperation('out');return;}
if(action==='libero-switch'){const m=match(),next=m?.regulation?.liberos.find(id=>id!==m?.regulation?.liberoActive);liberoOperation('switch',next);return;}
if(action==='board-use-lineup'){const m=match();if(!m){toast('Start a match first');return;}boardSnapshot();for(let pos=1;pos<=6;pos++){const marker=state.board.markers.find(x=>x.id==='h'+pos);const player=playerById(m,m.lineup.slots[pos-1]);if(marker)marker.label=player?String(player.number).slice(0,5):'–';}persist();render();toast('Current lineup copied to whiteboard');return;}
if(action==='select-player'){state.selectedPlayerId=id;persist();render();return}
if(action==='stat'){record(b.dataset.type,selectedPlayer()?.id||null);return}
if(action==='score'){record(b.dataset.type);return}
if(action==='undo-match'){undoMatch();return}
if(action==='finish-match'){finishMatch();return}
if(action==='new-match'){state.currentMatchId=null;state.matchUndo=[];persist();render();return}
if(action==='view-history'){state.historySelection=id;persist();render();return}
if(action==='close-history'){state.historySelection=null;persist();render();return}
if(action==='resume-match'){state.currentMatchId=id;state.tab='match';state.matchUndo=[];const m=match();state.selectedPlayerId=m?.lineup.slots.find(Boolean)||m?.roster[0]?.id||null;persist();render();return}
if(action==='delete-match'){if(!confirm('Permanently delete this match? Export a backup first if needed.'))return;state.matches=state.matches.filter(m=>m.id!==id);if(state.currentMatchId===id){state.currentMatchId=null;state.matchUndo=[];}if(state.historySelection===id)state.historySelection=null;persist();render();toast('Match deleted');return}
if(action==='export-csv'){exportCsv(state.matches.find(m=>m.id===id));return}
if(action==='delete-player'){const p=state.players.find(p=>p.id===id);if(!p||!confirm('Remove '+p.name+' from the future match roster?'))return;state.players=state.players.filter(p=>p.id!==id);state.defaultLineup=normalizeSlots(state.defaultLineup,state.players);persist();render();toast('Player removed');return}
if(action==='export-json'){download(JSON.stringify({...state,tab:'match',boardFocus:false,matchUndo:[],boardUndo:[]},null,2),'volleyboard-backup-'+dateLocal()+'.json','application/json');toast('Backup exported');return}
if(action==='focus-board'){state.boardFocus=!state.boardFocus;persist();render();return}
if(action==='board-tool'){state.boardTool=b.dataset.value;persist();render();return}
if(action==='pen-color'){state.penColor=b.dataset.value;state.boardTool='pen';persist();render();return}
if(action==='court-mode'){if(state.board.layout===b.dataset.value)return;if(!confirm('Switch court layout? This resets player positions and clears the drawing. Save the current play first if you need it.'))return;boardSnapshot();state.board=blankBoard(b.dataset.value);state.selectedMarkerId='h1';persist();render();return}
if(action==='board-undo'){if(!state.boardUndo.length)return;state.board=state.boardUndo.pop();persist();render();toast('Whiteboard action undone');return}
if(action==='clear-ink'){boardSnapshot();state.board.strokes=[];persist();render();toast('Drawing cleared');return}
if(action==='reset-markers'){boardSnapshot();const fresh=defaultMarkers(state.board.layout);state.board.markers=fresh;persist();render();toast('Markers reset');return}
if(action==='new-board'){if(!confirm('Start a fresh board? Save this play first if you want to keep it.'))return;boardSnapshot();state.board=blankBoard(state.board.layout);state.selectedMarkerId='h1';persist();render();return}
if(action==='save-play'){const input=$('#playName'),name=(input?.value||'').trim()||'Untitled play';state.board.name=name;state.plays.push({...clone(state.board),id:uid(),savedAt:new Date().toISOString()});persist();render();toast('Play saved: '+name);return}
if(action==='load-play'){const p=state.plays.find(x=>x.id===id);if(!p)return;boardSnapshot();state.board={layout:p.layout,markers:clone(p.markers),strokes:clone(p.strokes),name:p.name};state.selectedMarkerId='h1';persist();render();toast('Loaded '+p.name);return}
if(action==='delete-play'){const p=state.plays.find(x=>x.id===id);if(!p||!confirm('Delete saved play "'+p.name+'"?'))return;state.plays=state.plays.filter(p=>p.id!==id);persist();render();toast('Saved play deleted');return}
if(action==='export-png'){exportImage();return}
});
main.addEventListener('input',e=>{if(e.target.id==='playName'){state.board.name=e.target.value;persist()}});
window.addEventListener('resize',()=>{if(state.tab==='board'&&ctx)courtDraw()});
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
persist();render();
})();
