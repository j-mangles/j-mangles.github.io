name: Test ELA Camera Framing Studio
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  framing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate shot models and existing website
        run: |
          node --check ela/camera-studio.js
          node tools/test_camera_studio.cjs
          node tools/test_plot_evidence_board.cjs
          node tools/test_site_integration.cjs
