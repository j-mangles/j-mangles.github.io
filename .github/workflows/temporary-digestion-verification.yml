name: Verify digestion lesson
on:
  pull_request:
    paths:
      - '.github/workflows/temporary-digestion-verification.yml'
permissions:
  contents: read
jobs:
  classroom:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start the class site
        run: |
          npm install --no-save --no-package-lock playwright-core@1.56.1
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/class-site.log 2>&1 &
          for try in {1..20}; do curl -fsS http://127.0.0.1:8765/ -o /dev/null && break; sleep 1; done
      - name: Inspect both classroom layouts
        run: |
          node - <<'JS'
          const {chromium}=require("playwright-core");
          (async()=>{
            const b=await chromium.launch({channel:"chrome"});
            try{
              for(const width of [1280,390]){
                const p=await b.newPage({viewport:{width,height:width===390?844:900}});
                await p.goto("http://127.0.0.1:8765/science/labs.html");
                await p.locator("#lab-search").fill("Digestion");
                await p.locator(".entry").screenshot({path:"/tmp/dn-library-"+width+".png"});
                await p.locator(".entry a").click();
                await p.waitForFunction(()=>document.activeElement?.id==="digestion-pathway");
                await p.locator(".dn .steps [data-stage='3']").click();
                await p.waitForFunction(()=>document.querySelector(".dn-plate img")?.naturalWidth>0);
                await p.locator(".dn [value=blood]").check();
                await p.locator(".dn-test").click();
                await p.locator(".dn-layout").screenshot({path:"/tmp/dn-anatomy-"+width+".png"});
                await p.locator(".dn-fork").screenshot({path:"/tmp/dn-wall-"+width+".png"});
                await p.locator(".dn [data-trace=fibre]").click();await p.locator(".dn [value=gut]").check();await p.locator(".dn-test").click();
                await p.locator(".dn-record").screenshot({path:"/tmp/dn-record-"+width+".png"});
                await p.close();
              }
            }finally{await b.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          python -m pip -q install pillow
          python - <<'PY'
          from PIL import Image
          import base64,io,pathlib
          for path in sorted(pathlib.Path('/tmp').glob('dn-*.png')):
              im=Image.open(path).convert('RGB')
              im.thumbnail((580,650))
              b=io.BytesIO()
              im.save(b,format='WEBP',quality=66)
              print('VIEW_START '+path.name+' '+base64.b64encode(b.getvalue()).decode()+' VIEW_END')
          PY
      - name: Exercise all repository tests
        if: always()
        run: |
          mkdir /tmp/digestion-tests
          failed=0
          for check in tools/*.cjs; do
            node "$check" > "/tmp/digestion-tests/$(basename "$check").log" 2>&1 || { echo "::error::$check"; tail -25 "/tmp/digestion-tests/$(basename "$check").log"; failed=1; }
          done
          exit "$failed"
