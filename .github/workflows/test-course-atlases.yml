name: Test Course Atlases
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  course-maps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check navigation scripts
        run: |
          node --check assets/course-map.js
          node --check assets/hub.js
          node tools/test_course_map.cjs
          node tools/test_site_integration.cjs
