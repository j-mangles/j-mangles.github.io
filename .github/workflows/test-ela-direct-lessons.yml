name: Test ELA Direct Lessons
on:
  push:
    paths:
      - 'ela/data.js'
      - 'ela/index.html'
      - 'assets/hub.js'
      - 'tools/test_ela_direct_lessons.cjs'
      - '.github/workflows/test-ela-direct-lessons.yml'
  pull_request:
    paths:
      - 'ela/data.js'
      - 'ela/index.html'
      - 'assets/hub.js'
      - 'tools/test_ela_direct_lessons.cjs'
      - '.github/workflows/test-ela-direct-lessons.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/test_ela_direct_lessons.cjs
