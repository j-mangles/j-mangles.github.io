name: Test Think Lab Payoff Matrix
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  payoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate Game Theory models and existing student site
        run: |
          node --check critical-thinking/payoff-matrix.js
          node tools/test_payoff_matrix.cjs
          node tools/test_resource_library.cjs
          node tools/test_site_integration.cjs
