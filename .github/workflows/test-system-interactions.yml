name: Science systems interactives
on:
  push:
    paths:
      - science/system-interactions.js
      - science/exercise-response-lab.js
      - science/index.html
      - tools/test_system_interactions.cjs
      - tools/test_exercise_response_lab.cjs
      - tools/test_science_tool_registration.cjs
      - .github/workflows/test-system-interactions.yml
  pull_request:
    paths:
      - science/system-interactions.js
      - science/exercise-response-lab.js
      - science/index.html
      - tools/test_system_interactions.cjs
      - tools/test_exercise_response_lab.cjs
      - tools/test_science_tool_registration.cjs
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/test_system_interactions.cjs
      - run: node tools/test_exercise_response_lab.cjs
      - run: node tools/test_science_tool_registration.cjs
      - run: node tools/test_homeostasis.cjs
      - run: node tools/test_course_map.cjs
