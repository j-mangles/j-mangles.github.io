name: Test Homeostasis Lab
on:
  pull_request:
    paths:
      - 'science/homeostasis.js'
      - 'science/index.html'
      - 'tools/test_homeostasis.cjs'
      - '.github/workflows/check-homeostasis.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JavaScript syntax
        run: |
          node --check science/homeostasis.js
          node --check tools/test_homeostasis.cjs
      - name: Test temperature model and student interactions
        run: node tools/test_homeostasis.cjs
