name: Test Math Fraction Strip Lab
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  fraction-strips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check arithmetic, diagrams and other integrated components
        run: |
          node --check math/fraction-strips.js
          node tools/test_fraction_strips.cjs
          node tools/test_resource_library.cjs
          node tools/test_site_integration.cjs
