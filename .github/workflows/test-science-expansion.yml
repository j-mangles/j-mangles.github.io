name: Test Science Interactive Expansion
on:
  push:
    paths:
      - science/digestion-pathway.js
      - science/cell-division-studio.js
      - science/viscosity-race.js
      - science/lake-density-lab.js
      - science/refraction-ray-lab.js
      - science/seafloor-lab.js
      - science/earthquake-lab.js
      - science/index.html
      - science/labs.html
      - science/specialized-cell-explorer.js
      - science/energy-flow-studio.js
      - science/geological-dating-lab.js
      - science/prism-colour-lab.js
      - science/graphing-studio.js
      - science/measurement-challenge.js
      - science/osmosis-cell-response.js
      - science/continental-drift-evidence.js
      - tools/test_science_graph_measure_osmosis_drift.cjs
      - tools/test_science_next_wave.cjs
      - tools/test_science_expansion.cjs
      - tools/test_science_expansion_browser.cjs
      - .github/workflows/test-science-expansion.yml
  pull_request:
    paths:
      - science/digestion-pathway.js
      - science/cell-division-studio.js
      - science/viscosity-race.js
      - science/lake-density-lab.js
      - science/refraction-ray-lab.js
      - science/seafloor-lab.js
      - science/earthquake-lab.js
      - science/index.html
      - science/labs.html
      - science/specialized-cell-explorer.js
      - science/energy-flow-studio.js
      - science/geological-dating-lab.js
      - science/prism-colour-lab.js
      - science/graphing-studio.js
      - science/measurement-challenge.js
      - science/osmosis-cell-response.js
      - science/continental-drift-evidence.js
      - tools/test_science_graph_measure_osmosis_drift.cjs
      - tools/test_science_next_wave.cjs
      - tools/test_science_expansion.cjs
  workflow_dispatch:
jobs:
  science-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/test_science_expansion.cjs
      - run: node tools/test_science_next_wave.cjs
      - run: node tools/test_science_graph_measure_osmosis_drift.cjs
      - run: node tools/test_homeostasis.cjs
      - run: node tools/test_matter_unit.cjs
      - run: node tools/test_energy_light_unit.cjs
      - run: node tools/test_earth_unit.cjs
      - name: Install browser QA dependency
        run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Start local website
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/science-site.log 2>&1 &
          for i in {1..20}; do
            if curl --fail -s http://127.0.0.1:8765/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/science-site.log
          exit 1
      - name: Test the current Science labs in Chrome at desktop and phone sizes
        run: node tools/test_science_expansion_browser.cjs
      - name: Save Science visual check screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: science-current-labs-mobile
          path: browser-artifacts/science-*-mobile.png
          if-no-files-found: ignore
          retention-days: 7
