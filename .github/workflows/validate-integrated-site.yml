name: Validate Integrated Site
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Execute combined lesson integration checks
        run: |
          node --check assets/hub.js
          node --check assets/review.js
          node tools/test_site_integration.cjs
