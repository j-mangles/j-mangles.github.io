name: Test ELA Plot Evidence Board
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  plot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate plot stages, student response graphs and site integration
        run: |
          node --check ela/plot-evidence-board.js
          node tools/test_plot_evidence_board.cjs
          node tools/test_payoff_matrix.cjs
          node tools/test_site_integration.cjs
