name: Test Walkable Giza Expedition
on:
  pull_request:
    paths:
      - 'social-studies/giza-expedition*'
      - 'social-studies/index.html'
      - 'tools/test_giza_expedition.cjs'
      - '.github/workflows/test-giza-expedition.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate historical expedition and gameplay
        run: |
          node --check social-studies/giza-expedition-core.js
          node --check social-studies/giza-expedition.js
          node --check tools/test_giza_expedition.cjs
          node tools/test_giza_expedition.cjs
