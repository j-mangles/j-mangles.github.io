name: Test Earth and Plate Tectonics Explorer
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  earth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate Earth science concepts and site integration
        run: |
          node --check science/earth-explorer.js
          node tools/test_earth_explorer.cjs
          node tools/test_solar_explorer.cjs
          node tools/test_integer_lab.cjs
          node tools/test_resource_library.cjs
          node tools/test_site_integration.cjs
