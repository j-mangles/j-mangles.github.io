name: Test Solar Spectrum and Albedo
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  spectrum-albedo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check science and existing site models
        run: |
          node --check science/solar-explorer.js
          node tools/test_solar_explorer.cjs
          node tools/test_integer_lab.cjs
          node tools/test_resource_library.cjs
          node tools/test_site_integration.cjs
