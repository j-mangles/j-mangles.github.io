name: Test Comparative Chronology
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  chronology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compare actual Atlas spans and new overlap diagrams
        run: |
          node --check social-studies/chronology.js
          node tools/test_chronology.cjs
          node tools/test_atlas_lessons.cjs
          node tools/test_plot_evidence_board.cjs
          node tools/test_site_integration.cjs
