name: Test Artifact Evidence Desk
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate Site 14 and original atlas
        run: |
          node --check social-studies/source-lab.js
          node tools/test_site14_evidence.cjs
          node tools/test_chronology.cjs
          node tools/test_atlas_lessons.cjs
          node tools/test_site_integration.cjs
