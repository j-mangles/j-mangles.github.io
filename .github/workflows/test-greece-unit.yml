name: Test Ancient Greece Drive Unit
on:
  pull_request:
    paths:
      - 'social-studies/greece-*'
      - 'social-studies/greek-inquiry*'
      - 'social-studies/index.html'
      - 'tools/test_greece_unit.cjs'
      - 'tools/test_site_browser.cjs'
      - '.github/workflows/test-greece-unit.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  greece:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          node --check social-studies/greece-lessons.js
          node --check social-studies/greece-atlas.js
          node --check social-studies/greek-inquiry.js
          node tools/test_greece_unit.cjs
