name: Check Early Humans Atlas
on:
  pull_request:
    paths:
      - 'social-studies/index.html'
      - 'tools/test_atlas_lessons.cjs'
      - '.github/workflows/check-atlas-lessons.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate atlas scripts and lesson shape
        run: |
          node --check tools/test_atlas_lessons.cjs
          node tools/test_atlas_lessons.cjs
