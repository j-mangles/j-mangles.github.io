<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc"><title id="title">Plant cell cutaway</title><desc id="desc">A labelled diagram showing all nine organelles. The large vacuole occupies the centre; the nucleus and endoplasmic reticulum sit to its left. Chloroplasts, mitochondria and Golgi apparatus sit in the cytoplasm inside the membrane and cell wall.</desc><rect width="900" height="620" fill="#f1f5f2"/><path d="M175 160L650 120 755 230 730 480 240 510 150 395Z" fill="#8aa66e" stroke="#44643d" stroke-width="9"/><path d="M185 174L642 137 734 238 713 464 248 492 169 390Z" fill="#d9e9da" stroke="#ad9f5f" stroke-width="6"/><ellipse cx="480" cy="318" rx="150" ry="131" fill="#83ced8" stroke="#428a99" stroke-width="3"/><ellipse cx="290" cy="300" rx="67" ry="58" fill="#b592cd"/><circle cx="288" cy="300" r="23" fill="#805297"/><g fill="none" stroke="#718ab7" stroke-width="12"><path d="M215 265Q178 310 224 352M205 250Q157 310 214 370M198 236Q137 305 203 387"/></g><g fill="#63a76c" stroke="#367c42" stroke-width="3"><ellipse cx="555" cy="182" rx="55" ry="20" transform="rotate(-8 555 182)"/><ellipse cx="649" cy="391" rx="55" ry="22" transform="rotate(-35 649 391)"/></g><g fill="#db9c6e" stroke="#a06b47" stroke-width="3"><ellipse cx="359" cy="440" rx="40" ry="20" transform="rotate(12 359 440)"/><ellipse cx="654" cy="264" rx="34" ry="18" transform="rotate(48 654 264)"/></g><g fill="none" stroke="#bd7898" stroke-width="10"><path d="M544 443Q590 420 624 447M540 456Q589 432 629 460M539 470Q590 446 632 474"/></g><g stroke="#303e36" stroke-width="2" fill="none"><path d="M150 90L205 180M410 85L433 153M780 130L685 218M85 300L170 310M120 420L240 325M430 565L475 375M775 340L674 387M756 533L615 463M240 565L350 446"/></g><g fill="#26382d" font-family="sans-serif" font-size="22"><text x="65" y="80">Cell wall</text><text x="320" y="72">Cell membrane</text><text x="720" y="110">Cytoplasm</text><text x="20" y="285">ER</text><text x="20" y="450">Nucleus</text><text x="390" y="595">Vacuole</text><text x="725" y="325">Chloroplast</text><text x="660" y="565">Golgi apparatus</text><text x="135" y="600">Mitochondria</text></g></svg>